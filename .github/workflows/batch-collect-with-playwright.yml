name: ETF PDF 야간 전체 수집

# 이 파일의 코드 변경 커밋은 Windows Runner에서 즉시 검증합니다.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/batch-collect-with-playwright.yml'
      - 'krx-auto-login.js'
      - 'krx-etf-download.js'
      - 'krx-worker.js'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
  schedule:
    # 매일 23:30 KST = 14:30 UTC
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'login_only'
        type: choice
        options:
          - login_only
          - collect

permissions:
  contents: write

defaults:
  run:
    # PowerShell 실행 정책의 영향을 받지 않는 Windows 기본 셸을 사용합니다.
    shell: cmd

concurrency:
  group: etf-pdf-nightly-batch
  cancel-in-progress: true

jobs:
  collect:
    # KRX가 GitHub 호스팅 서버를 차단하므로 한국 내 Windows PC에서 실행합니다.
    runs-on: [self-hosted, Windows, X64]
    # 브라우저가 응답 없이 멈춰도 Windows runner를 장시간 점유하지 않습니다.
    timeout-minutes: 35

    steps:
      - name: 저장소 클론
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Chromium 설치
        run: npx playwright install chromium

      - name: KRX 접속 사전검사
        run: curl.exe --fail --silent --show-error --max-time 60 --output NUL https://data.krx.co.kr/

      - name: KRX 로그인 및 세션 저장
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'login_only') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[collect]'))
        env:
          KRX_LOGIN_ID: ${{ secrets.KRX_LOGIN_ID }}
          KRX_LOGIN_PASSWORD: ${{ secrets.KRX_LOGIN_PASSWORD }}
        run: npm run login

      - name: 로그인 전용 검증 완료
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'login_only') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[collect]'))
        run: echo "KRX 로그인과 세션 저장을 정상 완료했습니다."

      - name: 전체 ETF PDF 구성종목 수집
        if: github.event_name == 'schedule' || inputs.mode == 'collect' || contains(github.event.head_commit.message, '[collect]')
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KRX_LOGIN_ID: ${{ secrets.KRX_LOGIN_ID }}
          KRX_LOGIN_PASSWORD: ${{ secrets.KRX_LOGIN_PASSWORD }}
          ETF_CODE_FILTER: ${{ contains(github.event.head_commit.message, '[verify-449450]') && '449450' || '' }}
          CHECKPOINT_SIZE: ${{ contains(github.event.head_commit.message, '[verify-449450]') && '1' || '25' }}
          BATCH_TIMEOUT_MS: ${{ contains(github.event.head_commit.message, '[verify-449450]') && '1200000' || '1500000' }}
        run: npm run collect

      - name: 오류 진단자료 저장
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'collect' || contains(github.event.head_commit.message, '[collect]'))
        uses: actions/upload-artifact@v4
        with:
          name: krx-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: 최종 결과 커밋
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'collect' || contains(github.event.head_commit.message, '[collect]'))
        run: |
          git diff --quiet -- data/etf-compositions.json && exit /b 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf-compositions.json
          git commit -m "data: finalize ETF PDF collection"
          git push
