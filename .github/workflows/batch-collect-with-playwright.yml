name: ETF PDF 야간 전체 수집

# KRX finder 내부코드 및 PDF 유효성 검증; 449450 검증 후 전체 배치 재개
# 개인 PC 종료 후 GitHub-hosted runner 전체 수집 재시작

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/batch-collect-with-playwright.yml'
      - 'krx-auto-login.js'
      - 'krx-etf-download.js'
      - 'krx-worker.js'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
  schedule:
    # 매일 23:30 KST = 14:30 UTC
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'login_only'
        type: choice
        options:
          - login_only
          - collect

permissions:
  contents: write
  actions: write

concurrency:
  group: etf-pdf-nightly-batch
  # 코드 수정·정기 실행은 기존 실행을 교체하지만, 자동 이어받기는 현재 실행 종료 후 대기한다.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  collect:
    # GitHub가 매 실행마다 새 Windows VM을 제공하므로 개인 PC 전원과 무관하게 실행된다.
    runs-on: windows-latest
    # 표준 GitHub-hosted runner의 6시간 제한보다 먼저 종료해 결과 저장·이어받기 시간을 확보한다.
    timeout-minutes: 350
    defaults:
      run:
        shell: cmd

    steps:
      - name: 저장소 클론
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Chromium 설치
        run: npx playwright install chromium

      - name: KRX 접속 사전검사
        run: curl.exe --fail --silent --show-error --max-time 60 --output NUL https://data.krx.co.kr/

      - name: KRX 로그인 및 세션 저장
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'login_only') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[collect]')) }}
        env:
          KRX_LOGIN_ID: ${{ secrets.KRX_LOGIN_ID }}
          KRX_LOGIN_PASSWORD: ${{ secrets.KRX_LOGIN_PASSWORD }}
        run: npm run login

      - name: 로그인 전용 검증 완료
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'login_only') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[collect]')) }}
        run: echo "KRX 로그인과 세션 저장을 정상 완료했습니다."

      - name: 전체 ETF PDF 구성종목 수집
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'collect') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[collect]')) }}
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KRX_LOGIN_ID: ${{ secrets.KRX_LOGIN_ID }}
          KRX_LOGIN_PASSWORD: ${{ secrets.KRX_LOGIN_PASSWORD }}
          ETF_CODE_FILTER: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-449450]') && '449450' || '' }}
          CHECKPOINT_SIZE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-449450]') && '1' || '5' }}
          # 약 5시간 20분 뒤에는 정상적으로 체크포인트를 남기고 후속 실행으로 넘긴다.
          BATCH_TIMEOUT_MS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-449450]') && '1200000' || '19200000' }}
        run: npm run collect

      - name: 오류 진단자료 저장
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'collect') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[collect]'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: krx-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: 최종 결과 커밋
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'collect') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[collect]'))) }}
        run: |
          git diff --quiet -- data/etf-compositions.json && exit /b 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf-compositions.json
          git commit -m "data: finalize ETF PDF collection"
          git pull --rebase origin main
          git push

      - name: 미완료 수집 자동 이어받기
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'collect') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[collect]'))) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path 'data/etf-compositions.json')) {
            Write-Host '수집 상태 파일이 없어 자동 이어받기를 생략합니다.'
            exit 0
          }

          $state = Get-Content 'data/etf-compositions.json' -Raw | ConvertFrom-Json
          $completed = [int]$state.meta.completed
          $total = [int]$state.meta.total
          $failed = [int]$state.meta.failed
          $status = [string]$state.meta.status
          Write-Host "현재 상태: status=$status, completed=$completed/$total, failed=$failed"

          if ($status -ne 'completed' -or $completed -lt $total -or $failed -gt 0) {
            Write-Host '미완료 종목만 이어서 수집하도록 다음 GitHub-hosted 실행을 예약합니다.'
            gh workflow run batch-collect-with-playwright.yml --ref main -f mode=collect
          } else {
            Write-Host '전체 ETF PDF 수집이 완료되어 후속 실행을 예약하지 않습니다.'
          }
