name: ETF Lens 구성종목 전용 구조 검증

on:
  push:
    branches: [main]
    paths:
      - 'repair-site-contributions.js'
      - '.github/workflows/repair-site-contributions.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-composition-only-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 구성종목 전용 payload 업로드 및 API 검증
        id: verify
        continue-on-error: true
        env:
          ETF_SITE_URL: https://etf-attribution-mvp.bang-starone.chatgpt.site
          ETF_SITE_TOKEN: ${{ secrets.ETF_SITE_TOKEN }}
          ETF_CODE: '449450'
        run: node repair-site-contributions.js

      - name: 검증 결과 커밋
        if: always()
        run: |
          if [ ! -f data/site-diagnostics/repair-result.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-diagnostics/repair-result.json
          git diff --cached --quiet && exit 0
          git commit -m "data: verify composition-only site payload"
          git pull --rebase origin main
          git push

      - name: 구조 검증 실패 처리
        if: steps.verify.outcome != 'success'
        run: exit 1
