name: ETF Lens 기여도 데이터 복구

on:
  push:
    branches: [main]
    paths:
      - 'repair-site-contributions.js'
      - '.github/workflows/repair-site-contributions.yml'
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      code:
        description: '복구할 ETF 종목코드'
        required: true
        default: '449450'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 홈페이지 기여도 데이터 복구
        id: repair
        continue-on-error: true
        env:
          ETF_SITE_URL: https://etf-attribution-mvp.bang-starone.chatgpt.site
          ETF_SITE_TOKEN: ${{ secrets.ETF_SITE_TOKEN }}
          ETF_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.code || '449450' }}
        run: node repair-site-contributions.js

      - name: 의미 있는 복구 결과만 커밋
        if: always()
        run: |
          result=data/site-diagnostics/repair-result.json
          if [ ! -f "$result" ]; then exit 0; fi
          if git show HEAD:"$result" > /tmp/repair-old.json 2>/dev/null; then
            jq 'del(.capturedAt)' /tmp/repair-old.json > /tmp/repair-old-normalized.json
            jq 'del(.capturedAt)' "$result" > /tmp/repair-new-normalized.json
            if cmp -s /tmp/repair-old-normalized.json /tmp/repair-new-normalized.json; then
              git checkout -- "$result"
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$result"
          git commit -m "data: record ETF Lens contribution repair result"
          git pull --rebase origin main
          git push

      - name: 복구 검증
        if: steps.repair.outcome != 'success'
        run: exit 1
