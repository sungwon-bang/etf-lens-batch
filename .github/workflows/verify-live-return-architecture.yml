name: ETF Lens 실시간 수익률 구조 검증

on:
  push:
    branches: [main]
    paths:
      - 'verify-live-return-architecture.js'
      - '.github/workflows/verify-live-return-architecture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: PDF·API·배포 번들 읽기 전용 검증
        env:
          ETF_SITE_URL: https://etf-attribution-mvp.bang-starone.chatgpt.site
          ETF_CODE: '449450'
        run: node verify-live-return-architecture.js

      - name: 검증 결과 커밋
        if: always()
        run: |
          if [ ! -f data/site-diagnostics/architecture-check.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-diagnostics/architecture-check.json
          git diff --cached --quiet && exit 0
          git commit -m "data: record ETF Lens architecture verification"
          git pull --rebase origin main
          git push
