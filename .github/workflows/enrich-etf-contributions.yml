name: ETF PDF 수익률 필드 정규화

on:
  push:
    branches: [main]
    paths:
      - 'enrich-etf-contributions.js'
      - '.github/workflows/enrich-etf-contributions.yml'
  workflow_dispatch:
    inputs:
      code:
        description: '정규화할 ETF 종목코드'
        required: true
        default: '449450'

permissions:
  contents: write

concurrency:
  group: etf-return-normalization
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: PDF JSON의 저장 수익률 제거
        id: normalize
        continue-on-error: true
        env:
          ETF_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.code || '449450' }}
        run: node enrich-etf-contributions.js

      - name: 정규화 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf-compositions.json data/site-diagnostics/enrichment-result.json
          git diff --cached --quiet && exit 0
          git commit -m "data: clear stored ETF returns for live KRX fallback"
          git pull --rebase origin main
          git push

      - name: 정규화 성공 확인
        if: steps.normalize.outcome != 'success'
        run: exit 1
