name: ETF Lens 실시간 수익률 우선 검증

on:
  push:
    branches: [main]
    paths:
      - 'site-network-diagnose.js'
      - 'enrich-etf-contributions.js'
      - '.github/workflows/site-network-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 배포 API와 프론트 우선순위 검증
        env:
          ETF_SITE_URL: https://etf-attribution-mvp.bang-starone.chatgpt.site/
          ETF_CODE: '449450'
          ETF_NAME: PLUS K방산
          ETF_DATE: '20260724'
        run: node site-network-diagnose.js

      - name: 최신 진단 결과 커밋
        if: always()
        run: |
          if [ ! -f diagnostics/site-network.json ]; then exit 0; fi
          mkdir -p data/site-diagnostics
          cp diagnostics/site-network.json data/site-diagnostics/latest-network.json
          cp diagnostics/site-body.txt data/site-diagnostics/latest-body.txt
          cp diagnostics/site-api-summary.json data/site-diagnostics/latest-api-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-diagnostics/
          git diff --cached --quiet && exit 0
          git commit -m "data: verify ETF Lens live KRX return priority"
          git pull --rebase origin main
          git push

      - name: 진단자료 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-live-return-diagnosis-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
