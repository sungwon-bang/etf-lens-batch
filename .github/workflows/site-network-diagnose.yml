name: ETF Lens 배포 API 진단

on:
  push:
    branches: [main]
    paths:
      - 'site-network-diagnose.js'
      - 'repair-site-contributions.js'
      - '.github/workflows/site-network-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 실시간 수익률 보강 및 1차 진단
        id: enrich
        continue-on-error: true
        env:
          ETF_SITE_URL: https://etf-attribution-mvp.bang-starone.chatgpt.site/
          ETF_CODE: '449450'
          ETF_NAME: PLUS K방산
          ETF_DATE: '20260724'
        run: node site-network-diagnose.js

      - name: 보강 데이터 우선 커밋
        if: always()
        run: |
          mkdir -p data/site-diagnostics
          if [ -f diagnostics/enrichment-result.json ]; then
            cp diagnostics/enrichment-result.json data/site-diagnostics/enrichment-result.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf-compositions.json data/site-diagnostics/enrichment-result.json
          git diff --cached --quiet && exit 0
          git commit -m "data: enrich 449450 contributions from live KRX returns"
          git pull --rebase origin main
          git push

      - name: 홈페이지 /api/pdf 직접 보정
        id: repair
        if: steps.enrich.outcome == 'success'
        continue-on-error: true
        env:
          ETF_SITE_URL: https://etf-attribution-mvp.bang-starone.chatgpt.site
          ETF_SITE_TOKEN: ${{ secrets.ETF_SITE_TOKEN }}
          ETF_CODE: '449450'
        run: node repair-site-contributions.js

      - name: 홈페이지 보정 결과 커밋
        if: always()
        run: |
          if [ ! -f data/site-diagnostics/repair-result.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-diagnostics/repair-result.json
          git diff --cached --quiet && exit 0
          git commit -m "data: record ETF Lens contribution repair result"
          git pull --rebase origin main
          git push

      - name: 홈페이지 저장 반영 대기
        if: steps.repair.outcome == 'success'
        run: sleep 15

      - name: 배포 API non-zero 재검증
        id: verify
        if: steps.repair.outcome == 'success'
        continue-on-error: true
        env:
          ETF_SITE_URL: https://etf-attribution-mvp.bang-starone.chatgpt.site/
          ETF_CODE: '449450'
          ETF_NAME: PLUS K방산
          ETF_DATE: '20260724'
          SKIP_ENRICH: '1'
          VERIFY_EXPECT_NONZERO: '1'
        run: node site-network-diagnose.js

      - name: 최신 진단 결과 커밋
        if: always()
        run: |
          if [ ! -f diagnostics/site-network.json ]; then exit 0; fi
          mkdir -p data/site-diagnostics
          cp diagnostics/site-network.json data/site-diagnostics/latest-network.json
          cp diagnostics/site-body.txt data/site-diagnostics/latest-body.txt
          if [ -f diagnostics/site-api-summary.json ]; then
            cp diagnostics/site-api-summary.json data/site-diagnostics/latest-api-summary.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-diagnostics/
          git diff --cached --quiet && exit 0
          git commit -m "data: update ETF Lens deployed API diagnosis"
          git pull --rebase origin main
          git push

      - name: 진단자료 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-site-network-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: 보강·업로드·배포 검증 결과 확인
        if: steps.enrich.outcome != 'success' || steps.repair.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
